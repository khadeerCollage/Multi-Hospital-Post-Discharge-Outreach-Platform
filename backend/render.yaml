services:
  - type: web
    name: mhpdop-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: 24
      - key: CORS_ORIGINS
        sync: false
      - key: APP_NAME
        value: Multi-Hospital Post-Discharge Outreach Platform
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
